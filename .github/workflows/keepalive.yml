name: Keep-alive

# Mantém o serviço no ar sem depender de terceiros: bate no /health de tempos em
# tempos. Isso (1) acorda o Render e (2) dispara um SELECT 1 no banco pelo próprio
# /health, tirando o Supabase da inatividade — que é o que pausa o projeto após
# ~7 dias e derruba o login. O GitHub pode atrasar execuções agendadas sob carga;
# para evitar a pausa do Supabase, uma execução de vez em quando já basta.

on:
  schedule:
    - cron: '*/10 * * * *' # a cada ~10 minutos
  workflow_dispatch: {} # permite rodar manualmente pelo painel do GitHub

# Evita filas de execuções agendadas acumuladas.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://karick.onrender.com/health)
          echo "GET /health -> HTTP $code"
          test "$code" = "200"
